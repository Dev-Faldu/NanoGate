name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NANOGATE_LOAD_ML: "0"          # no GPU / model weights on CI runners
      ML_DEVICE: cpu
      LOCAL_MODEL_BASE_URL: http://127.0.0.1:9/v1   # nothing listens: model-down path is tested explicitly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install
        run: |
          pip install -r requirements-ci.txt
          python -m spacy download en_core_web_sm
      - name: Tests
        run: python -m pytest -q -rs
      - name: No fabricated metrics
        run: python scripts/check_no_fake_metrics.py

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check + production build
        run: npm run build
      - name: Unit tests
        run: npm test
