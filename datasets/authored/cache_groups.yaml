# AUTHORED EVALUATION SET — enterprise cache equivalence (not real company data).
# Written by the NanoGate team. Each group: one canonical request (cached), paraphrases that should
# REUSE its answer, and hard negatives that look similar but must NOT reuse it (typed by failure mode).
# Disclosure: the same team wrote the verifier's slot rules; PAWS (public) is reported separately
# as an independent adversarial check. Split is by group id (no group spans train/validation/test).
groups:
  - id: it-vpn-reset
    canonical: How do I reset the VPN client?
    paraphrases:
      - "What steps restore my VPN connection?"
      - "How can I reset the VPN software on my laptop?"
      - "My VPN client is stuck, how do I reset it?"
    hard_negatives:
      - {text: "How do I reset another employee's VPN password?", type: ownership}
      - {text: "How do I reset the VPN client for all users in the company?", type: scope}
      - {text: "How do I uninstall the VPN client?", type: action}
  - id: it-password-change
    canonical: How do I change my Windows password?
    paraphrases:
      - "What is the process to update my Windows login password?"
      - "How can I set a new password for my Windows account?"
    hard_negatives:
      - {text: "How do I change my manager's Windows password?", type: ownership}
      - {text: "How do I change the Windows password for every account in the domain?", type: scope}
      - {text: "How do I stop Windows from asking me to change my password?", type: polarity}
